<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Mathe Tutor</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --brand:    #644533;
  --black:    #111111;
  --white:    #ffffff;
  --offwhite: #f8f7f4;
  --paper:    #fbfaf6;
  --border:   #c8c4bc;
  --soft:     #e8e4dc;
  --muted:    #6b6560;
  --accent:   #644533;
  --serif:    'Times New Roman', Times, serif;
  --brand-font: 'Creepster', cursive;
}
html, body { height: 100%; }
body { font-family: var(--serif); background: var(--offwhite); color: var(--black); font-size: 17px; line-height: 1.8; }

/* ─── HEADER ─── */
.app-header { background: var(--white); border-bottom: 3px solid var(--black); padding: 18px 32px; text-align: center; position: relative; }
.app-header h1 { font-family: var(--brand-font); font-size: 2.4rem; color: var(--brand); letter-spacing: 0.04em; line-height: 1; }
.app-header .subtitle { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.16em; color: var(--muted); margin-top: 6px; }
.header-tools { position: absolute; top: 50%; right: 20px; transform: translateY(-50%); display: flex; gap: 8px; }
.header-tools button { background: none; border: 1px solid var(--border); padding: 6px 12px; font-family: var(--serif); font-size: 0.78rem; color: var(--muted); cursor: pointer; transition: all 0.15s; }
.header-tools button:hover { border-color: var(--black); color: var(--black); }
@media (max-width: 640px) { .header-tools { position: static; transform: none; justify-content: center; margin-top: 12px; } }

/* ─── MAIN ─── */
.main { max-width: 880px; margin: 0 auto; padding: 40px 24px 80px; }

/* ─── AUFGABENLISTE ─── */
#screen-list { display: block; }
.list-intro { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.task-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 640px) { .task-grid { grid-template-columns: 1fr; } }
@media (min-width: 641px) and (max-width: 900px) { .task-grid { grid-template-columns: repeat(2, 1fr); } }
.task-btn {
  background: var(--white); border: 1px solid var(--border); padding: 18px 16px;
  cursor: pointer; text-align: left; font-family: var(--serif); font-size: 0.95rem;
  line-height: 1.4; color: var(--black); transition: border-color 0.15s, background 0.15s;
  min-height: 92px; display: flex; flex-direction: column; gap: 6px; position: relative;
}
.task-btn:hover { border-color: var(--black); background: #f0ede8; }
.task-btn .task-thema { font-weight: 600; }
.task-btn .task-meta { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.task-btn .task-status {
  position: absolute; top: 12px; right: 12px; width: 14px; height: 14px;
  border-radius: 50%; border: 1.5px solid var(--border); background: var(--white);
}
.task-btn .task-status.angefangen { background: linear-gradient(90deg, var(--black) 50%, var(--white) 50%); border-color: var(--black); }
.task-btn .task-status.abgeschlossen { background: var(--black); border-color: var(--black); }

/* ─── LERNPFAD ─── */
#screen-learn { display: none; }
.progress-wrap { display: flex; gap: 4px; margin-bottom: 36px; }
.prog-seg { height: 3px; flex: 1; background: var(--border); transition: background 0.3s; }
.prog-seg.done { background: var(--black); }
.prog-seg.active { background: var(--muted); }
.station-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 20px; }

/* ─── CONTENT BOX ─── */
.content-box { background: var(--white); border: 1px solid var(--border); padding: 32px 36px; margin-bottom: 8px; }
@media (max-width: 600px) { .content-box { padding: 22px 20px; } }
.box-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 14px; }

/* ─── TEXTE ─── */
.aufgaben-text { font-size: 1rem; line-height: 1.85; text-align: left; }
.ziel-text { font-size: 1.05rem; font-style: italic; text-align: left; }

/* ─── SCHRITTE ─── */
.schritt-nr { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 4px; }
.schritt-titel { font-weight: bold; font-size: 1.08rem; margin-bottom: 12px; line-height: 1.3; }
.schritt-warum { font-size: 0.95rem; margin-bottom: 16px; color: #333; }
.schritt-rechnung { background: var(--paper); border-left: 3px solid var(--accent); padding: 16px 18px; overflow-x: auto; font-size: 0.92rem; }
.schritt-rechnung::-webkit-scrollbar { display: none; }
.schritt-rechnung { scrollbar-width: none; }

/* ─── FEHLER ─── */
.fehler-item { border-left: 3px solid #c0392b; padding: 14px 18px; background: #fef8f8; margin-bottom: 10px; font-size: 0.93rem; line-height: 1.7; }
.fehler-item:last-child { margin-bottom: 0; }

/* ─── ÜBEN ─── */
.ueben-hint { font-size: 0.82rem; color: var(--muted); font-style: italic; margin-bottom: 18px; }
.ueben-schritt { padding: 12px 16px; border: 1px solid var(--border); margin-bottom: 6px; font-weight: bold; font-size: 0.95rem; background: var(--paper); color: var(--muted); }
.aufdecken-btn { width: 100%; padding: 13px; border: 1px solid var(--black); background: var(--white); font-family: var(--serif); font-size: 0.9rem; cursor: pointer; text-align: center; letter-spacing: 0.04em; transition: background 0.15s; margin-top: 16px; }
.aufdecken-btn:hover { background: #f0ede8; }
.loesung-hidden { display: none; margin-top: 12px; }
.aufgedeckter-schritt { margin-bottom: 14px; padding: 18px; border: 1px solid var(--border); background: var(--white); }
.aufgedeckter-schritt .schritt-rechnung { padding: 12px 14px; font-size: 0.88rem; }

/* ─── ERGEBNIS ─── */
.ergebnis-box { border: 2px solid var(--black); padding: 18px 22px; text-align: left; margin-top: 16px; font-size: 1rem; overflow-x: auto; }

/* ─── LERNKARTEN ─── */
.karte { border: 1px solid var(--border); margin-bottom: 8px; background: var(--white); cursor: pointer; }
.karte-front { padding: 16px 20px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; transition: background 0.15s; }
.karte:hover .karte-front { background: #f5f3ef; }
.karte-frage { font-size: 0.95rem; line-height: 1.6; flex: 1; }
.karte-icon { color: var(--muted); font-size: 1rem; flex-shrink: 0; margin-top: 2px; transition: transform 0.2s; }
.karte.open .karte-icon { transform: rotate(180deg); }
.karte-back { display: none; padding: 16px 20px; border-top: 1px solid var(--border); background: var(--paper); font-size: 0.9rem; line-height: 1.7; }
.karte.open .karte-back { display: block; }

/* ─── GLÜCKWUNSCH ─── */
.glueckwunsch-box { background: var(--white); border: 2px solid var(--black); padding: 40px 36px; text-align: center; }
.glueckwunsch-icon { font-size: 2.8rem; margin-bottom: 16px; }
.glueckwunsch-titel { font-size: 1.4rem; font-weight: bold; margin-bottom: 12px; }
.glueckwunsch-text { font-size: 0.95rem; color: var(--muted); line-height: 1.8; }

/* ─── TRENNSEITE ─── */
.trenn-box { background: var(--black); color: var(--white); padding: 60px 40px; min-height: 260px; display: flex; flex-direction: column; justify-content: center; }
.trenn-titel { font-family: var(--serif); font-size: 1.8rem; font-weight: bold; letter-spacing: 0.02em; margin-bottom: 24px; line-height: 1.2; }
.trenn-text { font-size: 1rem; line-height: 1.85; color: #cccccc; max-width: 560px; }
@media (max-width: 600px) { .trenn-box { padding: 40px 24px; min-height: 200px; } .trenn-titel { font-size: 1.4rem; } }

/* ─── VISUALISIERUNG ─── */
.visu-frame { width: 100%; height: 480px; border: 1px solid var(--border); background: #000; display: block; }
@media (max-width: 640px) { .visu-frame { height: 380px; } }
.visu-hint { font-size: 0.85rem; color: var(--muted); font-style: italic; margin-top: 12px; line-height: 1.6; }
.visu-controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.visu-controls button { background: var(--white); border: 1px solid var(--border); padding: 8px 14px; font-family: var(--serif); font-size: 0.82rem; cursor: pointer; }
.visu-controls button:hover { border-color: var(--black); }

/* ─── NAV ─── */
.nav-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.nav-left { display: flex; gap: 10px; align-items: center; }
.nav-right { display: flex; gap: 10px; align-items: center; }
.btn-weiter { padding: 11px 32px; background: var(--black); color: var(--white); border: none; font-family: var(--serif); font-size: 0.88rem; letter-spacing: 0.04em; cursor: pointer; transition: background 0.15s; }
.btn-weiter:hover { background: #333; }
.btn-back { background: none; border: none; font-family: var(--serif); font-size: 0.82rem; color: var(--muted); cursor: pointer; }
.btn-back:hover { color: var(--black); }
.btn-prev { padding: 11px 22px; background: var(--white); color: var(--black); border: 1px solid var(--border); font-family: var(--serif); font-size: 0.88rem; letter-spacing: 0.04em; cursor: pointer; transition: background 0.15s; }
.btn-prev:hover { background: #f0ede8; border-color: var(--black); }

/* ─── KI-HILFE BUTTON & PANEL ─── */
.btn-hilfe {
  padding: 9px 14px; background: var(--paper); color: var(--accent);
  border: 1px solid var(--border); font-family: var(--serif); font-size: 0.82rem;
  cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
}
.btn-hilfe:hover { background: var(--soft); border-color: var(--accent); }
.btn-hilfe .help-count { font-size: 0.72rem; color: var(--muted); }
.btn-hilfe.disabled { opacity: 0.4; pointer-events: none; }

.hilfe-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(17, 17, 17, 0.5); z-index: 100; display: none;
  align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto;
}
.hilfe-overlay.open { display: flex; }
.hilfe-panel {
  background: var(--offwhite); border: 1px solid var(--black); width: 100%;
  max-width: 720px; padding: 32px 32px 36px; position: relative;
}
@media (max-width: 600px) { .hilfe-panel { padding: 22px 20px 28px; } }
.hilfe-titel { font-size: 1.1rem; font-weight: bold; margin-bottom: 6px; }
.hilfe-untertitel { font-size: 0.82rem; color: var(--muted); margin-bottom: 24px; }
.hilfe-close { position: absolute; top: 14px; right: 16px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--muted); padding: 4px 10px; line-height: 1; }
.hilfe-close:hover { color: var(--black); }

.prompt-card { background: var(--white); border: 1px solid var(--border); padding: 18px 20px; margin-bottom: 12px; }
.prompt-card .pc-cat { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 4px; }
.prompt-card .pc-titel { font-weight: bold; font-size: 1rem; margin-bottom: 4px; }
.prompt-card .pc-desc { font-size: 0.82rem; color: var(--muted); margin-bottom: 14px; font-style: italic; }
.prompt-card .pc-text {
  background: var(--paper); border-left: 3px solid var(--soft); padding: 12px 14px;
  font-family: 'Courier New', monospace; font-size: 0.78rem; line-height: 1.6;
  white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow-y: auto; color: #333;
}
.prompt-card .pc-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.prompt-card .pc-actions button {
  background: var(--white); border: 1px solid var(--border); padding: 7px 14px;
  font-family: var(--serif); font-size: 0.78rem; cursor: pointer; transition: all 0.15s;
}
.prompt-card .pc-actions button:hover { border-color: var(--black); }
.prompt-card .pc-actions .pc-copy.copied { background: #d4edda; border-color: #2d7a3a; color: #2d7a3a; }
.prompt-card .pc-actions a {
  background: var(--white); border: 1px solid var(--border); padding: 7px 14px;
  font-family: var(--serif); font-size: 0.78rem; color: var(--black); text-decoration: none; transition: all 0.15s;
}
.prompt-card .pc-actions a:hover { border-color: var(--black); }

/* ─── KATEX ─── */
.katex-display { text-align: left !important; margin: 0.4em 0 !important; overflow-x: auto; display: block !important; }
.katex-display .katex { text-align: left !important; }
.katex-display::-webkit-scrollbar { display: none; }
</style>
</head>
