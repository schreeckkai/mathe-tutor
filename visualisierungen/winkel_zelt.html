<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zelt · Vektor-Winkelformel</title>
<style>
  :root{
    --bg:#000000; --fg:#ecebe4; --muted:#8888a0;
    --blue:#58c4dd; --teal:#83c167; --red:#fc6255;
    --yellow:#f0c674; --purple:#9a72ac;
  }
  *{ box-sizing:border-box; }
  html,body{
    width:100%; height:100%; margin:0; padding:0;
    overflow:hidden; background:var(--bg); color:var(--fg);
    font-family:Cambria, Georgia, serif;
  }
  #c{ position:fixed; top:0; left:0; width:100vw; height:100vh; display:block; }
  .c-cyan  { color:var(--blue);   font-weight:600; }
  .c-green { color:var(--teal);   font-weight:600; }
  .c-teal  { color:var(--teal);   font-weight:600; }
  .c-yellow{ color:var(--yellow); font-weight:600; }
  .c-red   { color:var(--red);    font-weight:600; }
  .c-purple{ color:var(--purple); font-weight:600; }

  #task-panel{
    position:fixed; top:20px; left:20px;
    width:280px; font-size:12.5px; line-height:1.6;
    color:var(--muted); z-index:10;
  }
  #task-panel .label{
    font-size:10.5px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--yellow);
    margin-bottom:8px;
  }
  #task-panel .text{ color:#b8b8c8; font-style:italic; }

  #info{
    position:fixed; bottom:70px; left:50%;
    transform:translateX(-50%);
    width:min(760px, calc(100% - 40px));
    text-align:center; z-index:10;
  }
  #info .label{
    font-size:10.5px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--muted);
    margin-bottom:6px;
  }
  #info .title{
    font-size:16px; color:var(--blue);
    margin-bottom:6px; font-weight:600;
  }
  #info .desc{
    font-size:13.5px; color:var(--fg);
    line-height:1.55;
  }

  #top-bar{
    position:fixed; top:20px; left:50%;
    transform:translateX(-50%);
    display:flex; align-items:center; gap:10px; z-index:10;
  }
  .ctrl-btn{
    background:none; border:none; color:var(--muted);
    font-size:14px; cursor:pointer; padding:4px 8px;
    font-family:inherit;
  }
  .ctrl-btn:hover{ color:var(--fg); }
  #timeline{ display:flex; gap:3px; width:380px; height:18px; }
  .segment{
    position:relative; flex:1; height:100%;
    background:#1a1a2e; border-radius:2px;
    cursor:pointer; overflow:visible;
  }
  .segment .fill{
    position:absolute; top:0; left:0; height:100%; width:0;
    background:var(--blue); opacity:0.7; border-radius:2px;
  }
  .segment .num{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-size:10px; color:var(--fg); z-index:2;
  }
  .segment .ts{
    position:absolute; top:22px; left:50%;
    transform:translateX(-50%);
    font-size:9.5px; color:var(--muted);
    white-space:nowrap;
  }
  .segment .tip{
    position:absolute; bottom:100%; left:50%;
    transform:translateX(-50%); margin-bottom:6px;
    background:#111122; border:1px solid #333;
    padding:4px 8px; font-size:11px;
    white-space:nowrap; display:none; z-index:20; color:var(--fg);
  }
  .segment:hover .tip{ display:block; }

  #hint{
    position:fixed; top:20px; right:20px;
    font-size:11px; color:var(--muted); z-index:10;
  }

  @media (max-width:640px){
    #top-bar{ top:12px; gap:6px; max-width:calc(100vw - 16px); }
    #timeline{ width:calc(100vw - 160px); max-width:320px; min-width:160px; }
    .segment .num{ font-size:9px; }
    .segment .ts{ font-size:8.5px; top:22px; }
    #hint{ display:none; }
    #task-panel{ display:none; }
    #info{ bottom:20px; width:calc(100% - 24px); }
    #info .title{ font-size:14px; }
    #info .desc{ font-size:12.5px; line-height:1.5; }
  }
  @media (max-width:380px){
    #timeline{ width:calc(100vw - 130px); min-width:140px; }
    .segment .ts{ display:none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="task-panel">
  <div class="label">Aufgabe</div>
  <div class="text">
    Gleichschenkliges Dreieck ABC mit
    <span class="c-yellow">AB&nbsp;=&nbsp;(6,0,0)</span> und
    <span class="c-cyan">AC&nbsp;=&nbsp;(3,0,4)</span>.
    Berechne den Winkel α zwischen Zeltboden und Zeltkante.
    Was beschreibt 180°&nbsp;−&nbsp;2α?
  </div>
</div>

<div id="top-bar">
  <button class="ctrl-btn" id="btn-reset" title="Neu">↺</button>
  <button class="ctrl-btn" id="btn-pause" title="Pause">⏸</button>
  <div id="timeline"></div>
</div>

<div id="hint">Klick + Zieh zum Drehen · Scroll zum Zoomen</div>

<div id="info">
  <div class="label" id="infoLabel">Kapitel 1 von 5</div>
  <div class="title" id="infoTitle">…</div>
  <div class="desc" id="infoDesc">…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ------------------- Scene & Renderer ------------------- */
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 35, 80);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth/window.innerHeight, 0.1, 200);
camera.up.set(0,0,1);

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight, true);

/* ------------------- Vertices (world units) ------------------- */
// Scale S=1: longest axis AB = 6 units (in range 4..8) ✓
const A = new THREE.Vector3(0,0,0);
const B = new THREE.Vector3(6,0,0);
const C = new THREE.Vector3(3,0,4);

// BBox diag ≈ sqrt(36+16)=7.21 → camR ≈ 2.9 * 7.21 ≈ 20.9
let camR = 21;
let camTheta = Math.PI*0.5 + 0.25;
let camPhi   = Math.PI*0.5 - 0.18;
const camTarget = new THREE.Vector3(3, 0, 2);

function updateCamera(){
  const x = camR*Math.sin(camPhi)*Math.cos(camTheta);
  const y = camR*Math.sin(camPhi)*Math.sin(camTheta);
  const z = camR*Math.cos(camPhi);
  camera.position.set(camTarget.x+x, camTarget.y+y, camTarget.z+z);
  camera.lookAt(camTarget);
}
updateCamera();

/* ------------------- Helpers ------------------- */
function setMatFade(mat, maxOp){
  mat.transparent = true;
  mat.userData.maxOp = maxOp !== undefined ? maxOp : (mat.opacity !== undefined ? mat.opacity : 1);
  mat.opacity = 0;
}
function setGroupOpacity(obj, t){
  obj.traverse(o=>{
    if(o.material){
      const mats = Array.isArray(o.material)? o.material : [o.material];
      for(const m of mats){
        const mx = m.userData && m.userData.maxOp !== undefined ? m.userData.maxOp : 1;
        m.opacity = mx * t;
      }
    }
  });
  obj.visible = t > 0.001;
}

function makeLine(points, color, opacity){
  const g = new THREE.BufferGeometry().setFromPoints(points);
  const m = new THREE.LineBasicMaterial({ color, transparent:true, opacity });
  m.userData = { maxOp: opacity };
  const l = new THREE.Line(g, m);
  return l;
}

function makeThickLine(from, to, color, radius, opacity){
  radius = radius || 0.045;
  opacity = opacity !== undefined ? opacity : 1;
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(radius, radius, len, 10, 1, false);
  const mat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity });
  mat.userData = { maxOp: opacity };
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(from).addScaledVector(dir, 0.5);
  const up = new THREE.Vector3(0,1,0);
  const nd = dir.clone().normalize();
  const axis = new THREE.Vector3().crossVectors(up, nd);
  const ang = Math.acos(Math.max(-1, Math.min(1, up.dot(nd))));
  if(axis.length() > 1e-6) mesh.setRotationFromAxisAngle(axis.normalize(), ang);
  return mesh;
}

function makeCone(pos, dir, color, r, h){
  const geo = new THREE.ConeGeometry(r, h, 16);
  const mat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:1 });
  mat.userData = { maxOp: 1 };
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(pos);
  const up = new THREE.Vector3(0,1,0);
  const nd = dir.clone().normalize();
  const axis = new THREE.Vector3().crossVectors(up, nd);
  const ang = Math.acos(Math.max(-1, Math.min(1, up.dot(nd))));
  if(axis.length() > 1e-6) m.setRotationFromAxisAngle(axis.normalize(), ang);
  return m;
}

function makeDot(pos, color, radius){
  color = color === undefined ? 0xecebe4 : color;
  radius = radius || 0.055;
  const geo = new THREE.SphereGeometry(radius, 12, 12);
  const mat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:1 });
  mat.userData = { maxOp: 1 };
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(pos);
  return m;
}

function parseSubscripts(text){
  const segs = []; let i = 0;
  while(i < text.length){
    if(text[i] === '_' && i+1 < text.length){
      if(text[i+1] === '{'){
        const end = text.indexOf('}', i+2);
        if(end > 0){ segs.push({ text:text.substring(i+2,end), isSub:true }); i = end+1; continue; }
      } else { segs.push({ text:text[i+1], isSub:true }); i += 2; continue; }
    }
    let j = i;
    while(j < text.length && text[j] !== '_') j++;
    if(j > i) segs.push({ text:text.substring(i,j), isSub:false });
    i = j;
  }
  return segs;
}

function makeLabel(text, color, fs){
  color = color || '#ecebe4';
  fs = fs || 48;
  const segs = parseSubscripts(text);
  const probe = document.createElement('canvas').getContext('2d');
  let totalW = 0;
  for(const s of segs){
    probe.font = s.isSub
      ? `italic ${Math.round(fs*0.62)}px Cambria, Georgia, serif`
      : `italic ${fs}px Cambria, Georgia, serif`;
    totalW += probe.measureText(s.text).width;
  }
  const pad = 20;
  let w = Math.ceil(totalW) + pad*2;
  let h = Math.ceil(fs * 1.4) + pad*2;
  const dpr = 2;
  const cv = document.createElement('canvas');
  cv.width = w*dpr; cv.height = h*dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  let x = pad;
  const baseY = h/2;
  for(const s of segs){
    if(s.isSub){
      ctx.font = `italic ${Math.round(fs*0.62)}px Cambria, Georgia, serif`;
      ctx.fillText(s.text, x, baseY + fs*0.18);
    } else {
      ctx.font = `italic ${fs}px Cambria, Georgia, serif`;
      ctx.fillText(s.text, x, baseY);
    }
    x += ctx.measureText(s.text).width;
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({ map:tex, transparent:true, opacity:1, depthTest:false });
  mat.userData = { maxOp: 1 };
  const sp = new THREE.Sprite(mat);
  const aspect = w/h;
  const sy = fs * 0.006;
  sp.scale.set(sy*aspect, sy, 1);
  return sp;
}

/* ------------------- Build scene contents ------------------- */

// Grid in xy-plane (size 1.3 × longest axis 6 = 7.8 → use 8)
const grid = new THREE.GridHelper(8, 16, 0x26263d, 0x26263d);
grid.rotation.x = Math.PI/2;
setMatFade(grid.material, 0.6);
scene.add(grid);

// Axes
function makeAxis(dir, label){
  const g = new THREE.Group();
  const L = 5.5;
  const end = dir.clone().multiplyScalar(L);
  const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), end]);
  const lmat = new THREE.LineBasicMaterial({ color:0x777799, transparent:true, opacity:0.7 });
  lmat.userData = { maxOp:0.7 };
  g.add(new THREE.Line(geo, lmat));
  const cone = makeCone(end, dir, 0x777799, 0.11, 0.38);
  cone.material.opacity = 0.7; cone.material.userData.maxOp = 0.7;
  g.add(cone);
  const lbl = makeLabel(label, '#8888a0', 40);
  lbl.position.copy(end).addScaledVector(dir, 0.35);
  g.add(lbl);
  return g;
}
const xAxis = makeAxis(new THREE.Vector3(1,0,0), 'x');
const yAxis = makeAxis(new THREE.Vector3(0,1,0), 'y');
const zAxis = makeAxis(new THREE.Vector3(0,0,1), 'z');
scene.add(xAxis); scene.add(yAxis); scene.add(zAxis);

// Ghost triangle outline + fill (always present faintly)
const ghostOutline = makeLine([A,B,C,A], 0x555575, 0.45);
scene.add(ghostOutline);

const triGeo = new THREE.BufferGeometry();
triGeo.setAttribute('position', new THREE.Float32BufferAttribute(
  [A.x,A.y,A.z, B.x,B.y,B.z, C.x,C.y,C.z], 3));
triGeo.setIndex([0,1,2]);
triGeo.computeVertexNormals();
const ghostFillMat = new THREE.MeshBasicMaterial({ color:0x333355, transparent:true, opacity:0.1, side:THREE.DoubleSide });
ghostFillMat.userData = { maxOp: 0.1 };
const ghostFill = new THREE.Mesh(triGeo, ghostFillMat);
scene.add(ghostFill);

// Highlighted edges
const edgeAB = makeThickLine(A, B, 0xf0c674, 0.05, 1);  // yellow (floor)
const edgeAC = makeThickLine(A, C, 0x58c4dd, 0.05, 1);  // cyan (given edge)
const edgeBC = makeThickLine(B, C, 0x9a72ac, 0.05, 1);  // purple (partner leg)
scene.add(edgeAB); scene.add(edgeAC); scene.add(edgeBC);

// Vertex dots
const dotA = makeDot(A, 0xecebe4, 0.07);
const dotB = makeDot(B, 0xecebe4, 0.07);
const dotC = makeDot(C, 0xecebe4, 0.085);
scene.add(dotA); scene.add(dotB); scene.add(dotC);

// Vertex labels
const lblA = makeLabel('A', '#ecebe4', 46);
lblA.position.set(-0.32, 0, -0.18);
scene.add(lblA);
const lblB = makeLabel('B', '#ecebe4', 46);
lblB.position.set(6.32, 0, -0.18);
scene.add(lblB);
const lblC = makeLabel('C', '#ecebe4', 46);
lblC.position.set(3, 0, 4.35);
scene.add(lblC);

// Edge-vector labels (fade with chapter 1)
const lblAB = makeLabel('AB', '#f0c674', 42);
lblAB.position.set(3, 0, -0.35);
scene.add(lblAB);
const lblAC = makeLabel('AC', '#58c4dd', 42);
// Offset perpendicular to AC, to the left (−x side)
const acDir = new THREE.Vector3().subVectors(C, A).normalize();
const acPerp = new THREE.Vector3(-acDir.z, 0, acDir.x); // rotate 90° in xz
lblAC.position.copy(A).addScaledVector(acDir, 2.6).addScaledVector(acPerp, 0.35);
scene.add(lblAC);

// BC partner-length marker: "|AC|=|BC|=5" sort of thing handled via label in chapter 5
const lblBC = makeLabel('BC', '#9a72ac', 42);
const bcDir = new THREE.Vector3().subVectors(C, B).normalize();
const bcPerp = new THREE.Vector3(bcDir.z, 0, -bcDir.x); // outward on +x side
lblBC.position.copy(B).addScaledVector(bcDir, 2.6).addScaledVector(bcPerp, 0.35);
scene.add(lblBC);

/* ------------------- Angle arcs ------------------- */
function makeArc(vertex, d1, d2, radius, color, fillOp){
  const group = new THREE.Group();
  const segs = 36;
  const theta = Math.acos(Math.max(-1, Math.min(1, d1.dot(d2))));
  const axis = new THREE.Vector3().crossVectors(d1, d2).normalize();
  const pts = [];
  for(let i=0;i<=segs;i++){
    const t = i/segs;
    const rot = new THREE.Matrix4().makeRotationAxis(axis, t*theta);
    const v = d1.clone().applyMatrix4(rot).multiplyScalar(radius);
    pts.push(v.add(vertex));
  }
  // outline
  const outline = makeLine(pts, color, 1);
  group.add(outline);
  // fill
  const fgeo = new THREE.BufferGeometry();
  const verts = [vertex.x, vertex.y, vertex.z];
  const idx = [];
  for(const p of pts) verts.push(p.x, p.y, p.z);
  for(let i=0;i<segs;i++) idx.push(0, i+1, i+2);
  fgeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  fgeo.setIndex(idx);
  const fmat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:fillOp, side:THREE.DoubleSide });
  fmat.userData = { maxOp: fillOp };
  group.add(new THREE.Mesh(fgeo, fmat));
  // mid bisector (for label placement)
  const midDir = d1.clone().add(d2).normalize();
  group.userData.midDir = midDir;
  return group;
}

const dirAB = new THREE.Vector3().subVectors(B,A).normalize();
const dirAC = new THREE.Vector3().subVectors(C,A).normalize();
const dirBA = new THREE.Vector3().subVectors(A,B).normalize();
const dirBC = new THREE.Vector3().subVectors(C,B).normalize();
const dirCA = new THREE.Vector3().subVectors(A,C).normalize();
const dirCB = new THREE.Vector3().subVectors(B,C).normalize();

const arcA = makeArc(A, dirAB, dirAC, 0.95, 0xf0c674, 0.28);
const arcB = makeArc(B, dirBA, dirBC, 0.95, 0xf0c674, 0.28);
const arcC = makeArc(C, dirCA, dirCB, 0.95, 0x58c4dd, 0.32);
scene.add(arcA); scene.add(arcB); scene.add(arcC);

const alphaLabelA = makeLabel('α', '#f0c674', 52);
alphaLabelA.position.copy(A).addScaledVector(arcA.userData.midDir, 1.4);
scene.add(alphaLabelA);

const alphaLabelB = makeLabel('α', '#f0c674', 52);
alphaLabelB.position.copy(B).addScaledVector(arcB.userData.midDir, 1.4);
scene.add(alphaLabelB);

const gammaLabel = makeLabel('180°−2α', '#58c4dd', 40);
gammaLabel.position.copy(C).addScaledVector(arcC.userData.midDir, 1.45);
scene.add(gammaLabel);

/* ------------------- Fade groups ------------------- */
const G = {
  axes:    [xAxis, yAxis, zAxis],
  grid:    [grid],
  ghost:   [ghostOutline, ghostFill],
  edgeAB:  [edgeAB, lblAB],
  edgeAC:  [edgeAC, lblAC],
  edgeBC:  [edgeBC, lblBC],
  dots:    [dotA, dotB, dotC],
  lblA:    [lblA], lblB: [lblB], lblC: [lblC],
  arcA:    [arcA, alphaLabelA],
  arcB:    [arcB, alphaLabelB],
  arcC:    [arcC, gammaLabel],
};

// Initialize: hide everything
for(const k in G){ for(const o of G[k]) setGroupOpacity(o, 0); }

/* ------------------- Chapters ------------------- */
const chapters = [
  {
    t: 5.5,
    label: 'Kapitel 1 von 5',
    title: 'Das Zelt im Koordinatensystem',
    desc: 'Die Vorderseite des Zeltes ist ein Dreieck ABC. Der Zeltboden <span class="c-yellow">AB = (6,0,0)</span> liegt in der x-Richtung, die linke Zeltkante <span class="c-cyan">AC = (3,0,4)</span> führt zur Spitze.',
    vis: ['axes','grid','ghost','edgeAB','edgeAC','dots','lblA','lblB','lblC']
  },
  {
    t: 6.0,
    label: 'Kapitel 2 von 5',
    title: 'Skalarprodukt und Längen',
    desc: '<span class="c-yellow">AB</span>·<span class="c-cyan">AC</span> = 6·3 + 0·0 + 0·4 = 18. Längen: |<span class="c-yellow">AB</span>| = 6, &nbsp; |<span class="c-cyan">AC</span>| = √(9+16) = 5.',
    vis: ['axes','grid','ghost','edgeAB','edgeAC','dots','lblA','lblB','lblC']
  },
  {
    t: 5.5,
    label: 'Kapitel 3 von 5',
    title: 'Winkelformel einsetzen',
    desc: 'cos(<span class="c-yellow">α</span>) = (AB·AC) / (|AB|·|AC|) = 18 / (6·5) = <span class="c-yellow">0,6</span>.',
    vis: ['axes','grid','ghost','edgeAB','edgeAC','dots','lblA','lblB','lblC','arcA']
  },
  {
    t: 5.5,
    label: 'Kapitel 4 von 5',
    title: 'Winkel α berechnen',
    desc: '<span class="c-yellow">α</span> = arccos(0,6) ≈ <span class="c-yellow">53,13°</span> — der Neigungswinkel der Zeltkante gegen den Boden.',
    vis: ['axes','grid','ghost','edgeAB','edgeAC','dots','lblA','lblB','lblC','arcA']
  },
  {
    t: 7.5,
    label: 'Kapitel 5 von 5',
    title: 'Was beschreibt 180° − 2α?',
    desc: 'Im <span class="c-purple">gleichschenkligen</span> Dreieck sind beide <span class="c-yellow">Bodenwinkel</span> gleich α. Weil die Innenwinkelsumme 180° ist, bleibt <span class="c-cyan">180° − 2α ≈ 73,74°</span> für den Winkel an der Zeltspitze C.',
    vis: ['axes','grid','ghost','edgeAB','edgeAC','edgeBC','dots','lblA','lblB','lblC','arcA','arcB','arcC']
  }
];

/* ------------------- Timeline ------------------- */
const timelineEl = document.getElementById('timeline');
const cumTimes = [0];
for(const ch of chapters) cumTimes.push(cumTimes[cumTimes.length-1] + ch.t);

function fmt(t){
  const m = Math.floor(t/60);
  const s = Math.floor(t%60);
  return m + ':' + String(s).padStart(2,'0');
}

const segments = [];
chapters.forEach((ch, i)=>{
  const seg = document.createElement('div');
  seg.className = 'segment';
  seg.style.flex = ch.t;
  seg.innerHTML =
    '<div class="fill"></div>' +
    '<div class="num">'+(i+1)+'</div>' +
    '<div class="ts">'+fmt(cumTimes[i])+'</div>' +
    '<div class="tip">'+ch.title.replace(/<[^>]+>/g,'')+' · '+fmt(cumTimes[i])+'–'+fmt(cumTimes[i+1])+'</div>';
  seg.addEventListener('click', ()=> seekTo(i));
  timelineEl.appendChild(seg);
  segments.push(seg);
});

/* ------------------- Playback state ------------------- */
const infoLabel = document.getElementById('infoLabel');
const infoTitle = document.getElementById('infoTitle');
const infoDesc  = document.getElementById('infoDesc');

let currentCh = 0;
let chElapsed = 0;
let playing = true;
let endPause = 0;
let newKeys = []; // groups to fade in during current chapter

function unionVisibleUpTo(i){
  const set = new Set();
  for(let j=0; j<=i; j++){
    for(const k of chapters[j].vis) set.add(k);
  }
  return set;
}

function setEndState(i){
  // i = -1: nothing visible
  const vis = i < 0 ? new Set() : unionVisibleUpTo(i);
  for(const k in G){
    const op = vis.has(k) ? 1 : 0;
    for(const o of G[k]) setGroupOpacity(o, op);
  }
}

function enterChapter(i){
  currentCh = i;
  chElapsed = 0;
  // Previous state fully shown
  setEndState(i-1);
  // Determine new keys to fade in
  const prevSet = i > 0 ? unionVisibleUpTo(i-1) : new Set();
  newKeys = [];
  for(const k of chapters[i].vis){
    if(!prevSet.has(k)) newKeys.push(k);
  }
  const ch = chapters[i];
  infoLabel.textContent = ch.label;
  infoTitle.innerHTML = ch.title;
  infoDesc.innerHTML = ch.desc;
}

function seekTo(i){
  endPause = 0;
  enterChapter(i);
}

seekTo(0);

/* ------------------- Animation loop ------------------- */
let lastT = performance.now();
let autoRotate = true;
let autoRotateTimeout = 0;

function animate(now){
  const dt = Math.min((now - lastT)/1000, 0.05);
  lastT = now;

  if(playing){
    if(endPause > 0){
      endPause -= dt;
      if(endPause <= 0) seekTo(0);
    } else {
      chElapsed += dt;
      const ch = chapters[currentCh];
      const fadeIn = Math.min(chElapsed / 0.8, 1);
      for(const k of newKeys){
        for(const o of G[k]) setGroupOpacity(o, fadeIn);
      }
      if(chElapsed >= ch.t){
        if(currentCh < chapters.length - 1){
          enterChapter(currentCh + 1);
        } else {
          endPause = 2.5;
        }
      }
    }
  }

  segments.forEach((seg, i)=>{
    const fill = seg.querySelector('.fill');
    let pct = 0;
    if(i < currentCh) pct = 100;
    else if(i === currentCh) pct = (chElapsed / chapters[i].t) * 100;
    fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
  });

  if(autoRotate && now > autoRotateTimeout){
    camTheta += dt * 0.12;
    updateCamera();
  }

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

/* ------------------- Controls ------------------- */
document.getElementById('btn-reset').addEventListener('click', ()=>{
  seekTo(0);
  playing = true;
  document.getElementById('btn-pause').textContent = '⏸';
});
document.getElementById('btn-pause').addEventListener('click', ()=>{
  playing = !playing;
  document.getElementById('btn-pause').textContent = playing ? '⏸' : '▶';
});

let isDragging = false;
let lastX = 0, lastY = 0;
function userInteract(){ autoRotateTimeout = performance.now() + 3500; }

canvas.addEventListener('mousedown', e=>{
  isDragging = true; lastX = e.clientX; lastY = e.clientY; userInteract();
});
window.addEventListener('mousemove', e=>{
  if(!isDragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  camTheta -= dx * 0.01;
  camPhi = Math.max(0.1, Math.min(Math.PI - 0.1, camPhi - dy * 0.01));
  updateCamera();
  lastX = e.clientX; lastY = e.clientY;
  userInteract();
});
window.addEventListener('mouseup', ()=>{ isDragging = false; });

canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  camR = Math.max(7, Math.min(45, camR * (1 + e.deltaY * 0.001)));
  updateCamera();
  userInteract();
}, { passive:false });

let lastTouchDist = 0;
canvas.addEventListener('touchstart', e=>{
  if(e.touches.length === 1){
    isDragging = true;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  } else if(e.touches.length === 2){
    isDragging = false;
    lastTouchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY);
  }
  userInteract();
}, { passive:false });
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(e.touches.length === 1 && isDragging){
    const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
    camTheta -= dx * 0.01;
    camPhi = Math.max(0.1, Math.min(Math.PI - 0.1, camPhi - dy * 0.01));
    updateCamera();
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  } else if(e.touches.length === 2){
    const d = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY);
    if(lastTouchDist > 0){
      camR = Math.max(7, Math.min(45, camR * (lastTouchDist / d)));
      updateCamera();
    }
    lastTouchDist = d;
  }
  userInteract();
}, { passive:false });
canvas.addEventListener('touchend', ()=>{ isDragging = false; lastTouchDist = 0; });

function resize(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight, true);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

})();
</script>
