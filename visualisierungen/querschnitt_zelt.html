<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Festivalzelt – LED-Bildschirm</title>
<style>
:root{
  --bg:#000;
  --fg:#ecebe4;
  --muted:#8888a0;
  --blue:#58c4dd;
  --teal:#83c167;
  --red:#fc6255;
  --yellow:#f0c674;
  --purple:#9a72ac;
}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Cambria,Georgia,serif;}
#c{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;}
.c-cyan{color:var(--blue);font-weight:600;}
.c-green,.c-teal{color:var(--teal);font-weight:600;}
.c-yellow{color:var(--yellow);font-weight:600;}
.c-red{color:var(--red);font-weight:600;}
.c-purple{color:var(--purple);font-weight:600;}
.formula{font-style:italic;}

#top-bar{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;z-index:10;
}
.btn{
  background:transparent;color:var(--muted);border:none;
  font:13px Cambria,serif;cursor:pointer;padding:4px 8px;
}
.btn:hover{color:var(--fg);}

#timeline{
  display:flex;gap:4px;height:14px;width:460px;position:relative;
}
.segment{
  flex:1;height:14px;position:relative;cursor:pointer;
  background:rgba(255,255,255,0.05);border-radius:2px;overflow:visible;
}
.segment .fill{
  position:absolute;top:0;left:0;height:100%;
  background:var(--blue);border-radius:2px;width:0%;
}
.segment .num{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font:600 10px Cambria,serif;color:var(--fg);pointer-events:none;z-index:2;
}
.segment .ts{
  position:absolute;top:18px;left:50%;transform:translateX(-50%);
  font:9.5px Cambria,serif;color:var(--muted);
}
.segment .tooltip{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  background:rgba(20,20,30,0.95);color:var(--fg);
  padding:6px 10px;border-radius:4px;white-space:nowrap;
  font:11px Cambria,serif;opacity:0;pointer-events:none;
  transition:opacity 0.2s;
}
.segment:hover .tooltip{opacity:1;}

#hint{
  position:fixed;top:16px;right:18px;color:var(--muted);
  font:italic 12px Cambria,serif;z-index:10;
}
#task-panel{
  position:fixed;top:60px;left:18px;width:280px;z-index:10;
  color:var(--fg);font:12.5px Cambria,serif;line-height:1.55;
}
#task-panel .label{
  font:11px Cambria,serif;color:var(--yellow);
  letter-spacing:0.14em;text-transform:uppercase;margin-bottom:8px;
}
#info{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  width:640px;max-width:calc(100% - 24px);text-align:center;z-index:10;
}
#info .label{
  font:11px Cambria,serif;color:var(--muted);
  letter-spacing:0.14em;text-transform:uppercase;margin-bottom:6px;
}
#info .title{font:16px Cambria,serif;color:var(--blue);margin-bottom:6px;}
#info .desc{font:13.5px Cambria,serif;color:var(--fg);line-height:1.55;}

@media (max-width:640px){
  #top-bar{top:12px;gap:6px;max-width:calc(100vw - 16px);}
  #timeline{width:calc(100vw - 160px);max-width:320px;min-width:160px;}
  .segment .num{font-size:9px;}
  .segment .ts{font-size:8.5px;top:22px;}
  #hint{display:none;}
  #task-panel{display:none;}
  #info{bottom:20px;width:calc(100% - 24px);}
  #info .title{font-size:14px;}
  #info .desc{font-size:12.5px;line-height:1.5;}
  .formula{font-size:13.5px;}
}
@media (max-width:380px){
  #timeline{width:calc(100vw - 130px);min-width:140px;}
  .segment .ts{display:none;}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top-bar">
  <button id="btn-restart" class="btn">↺ Neu</button>
  <button id="btn-pause" class="btn">⏸ Pause</button>
  <div id="timeline"></div>
</div>

<div id="hint">2D-Querschnitt · Vorderseite des Zeltes</div>

<div id="task-panel">
  <div class="label">Aufgabe</div>
  <div>Dreieckige Zeltfront, Boden <span class="c-yellow">16 m</span>, Höhe <span class="c-yellow">13 m</span>. Ein <span class="c-red">5 m</span> breiter LED-Bildschirm soll auf <span class="c-green">9 m</span> Höhe waagerecht aufgehängt werden. Reicht die Breite?</div>
</div>

<div id="info">
  <div class="label" id="info-label">Kapitel 1 von 5</div>
  <div class="title" id="info-title">Titel</div>
  <div class="desc" id="info-desc">Beschreibung</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============== SETUP ==============
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.Fog(0x000000, 35, 80);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth/window.innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight, true);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

// Maßstab: längste Achse ist die Bodenbreite (16 m). S = 0.4 → 6.4 Units (in [4,8] ✓)
const S      = 0.4;
const BASE   = 16 * S;          // 6.4
const HMAX   = 13 * S;          // 5.2
const Z9     = 9  * S;          // 3.6
const W9     = (64/13) * S;     // ≈ 1.969
const SCREEN = 5  * S;          // 2.0

// 2D: Kamera schaut von +z auf die xy-Ebene (Vorderseite des Zeltes)
camera.up.set(0, 1, 0);
const camTarget = new THREE.Vector3(0, HMAX/2 + 0.1, 0);
const camR = 17;
camera.position.set(camTarget.x, camTarget.y, camR);
camera.lookAt(camTarget);

scene.add(new THREE.AmbientLight(0xffffff, 1));

// ============== HELPERS ==============
function makeMat(color, opacity){
  const m = new THREE.MeshBasicMaterial({color, transparent:true, opacity, side:THREE.DoubleSide});
  m.userData.maxOp = opacity;
  return m;
}
function makeLineMat(color, opacity){
  const m = new THREE.LineBasicMaterial({color, transparent:true, opacity});
  m.userData.maxOp = opacity;
  return m;
}
function setGroupOpacity(group, factor){
  group.traverse(o => {
    if(o.material){
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => {
        if(m.userData && m.userData.maxOp !== undefined){
          m.opacity = m.userData.maxOp * factor;
        }
      });
    }
  });
  group.visible = factor > 0.01;
}

function parseSubscripts(text){
  const parts = [];
  let i = 0;
  while(i < text.length){
    if(text[i] === '_'){
      i++;
      if(text[i] === '{'){
        i++;
        let s = '';
        while(i < text.length && text[i] !== '}') s += text[i++];
        i++;
        parts.push({text:s, sub:true});
      } else {
        parts.push({text:text[i], sub:true});
        i++;
      }
    } else {
      let s = '';
      while(i < text.length && text[i] !== '_') s += text[i++];
      parts.push({text:s, sub:false});
    }
  }
  return parts;
}

function makeLabel(text, color, fs){
  fs = fs || 48;
  const cv = document.createElement('canvas');
  let ctx = cv.getContext('2d');
  const baseFont = `italic ${fs}px Cambria, Georgia, serif`;
  const subFs   = fs * 0.62;
  const subFont = `italic ${subFs}px Cambria, Georgia, serif`;

  const parts = parseSubscripts(text);
  let totalW = 0;
  parts.forEach(p => {
    ctx.font = p.sub ? subFont : baseFont;
    totalW += ctx.measureText(p.text).width;
  });
  const padX = 18, padY = 14;
  cv.width  = Math.max(64, Math.ceil(totalW + 2*padX));
  cv.height = Math.ceil(fs * 1.6 + 2*padY);

  ctx = cv.getContext('2d');
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  let x = padX;
  const yMid = cv.height/2;
  parts.forEach(p => {
    if(p.sub){
      ctx.font = subFont;
      ctx.fillText(p.text, x, yMid + fs * 0.18);
      x += ctx.measureText(p.text).width;
    } else {
      ctx.font = baseFont;
      ctx.fillText(p.text, x, yMid);
      x += ctx.measureText(p.text).width;
    }
  });

  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true, opacity:1});
  mat.userData.maxOp = 1;
  const sprite = new THREE.Sprite(mat);
  const scaleY = fs * 0.006;
  const aspect = cv.width / cv.height;
  sprite.scale.set(scaleY * aspect, scaleY, 1);
  return sprite;
}

function makeDot(pos, color, radius){
  const g = new THREE.SphereGeometry(radius || 0.055, 12, 12);
  const m = makeMat(color !== undefined ? color : 0xecebe4, 1);
  const s = new THREE.Mesh(g, m);
  s.position.copy(pos);
  return s;
}
function makeLine(pts, color, opacity){
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const m = makeLineMat(color, opacity);
  return new THREE.Line(g, m);
}

// Dreiecks-Eckpunkte
const V_LEFT  = new THREE.Vector3(-BASE/2, 0, 0);
const V_RIGHT = new THREE.Vector3( BASE/2, 0, 0);
const V_APEX  = new THREE.Vector3(0, HMAX, 0);

// ============== GRID (in xy-Ebene) ==============
const gridGroup = new THREE.Group();
const cellSize = 0.4;            // 1 m = 0.4 Units
const gridW    = 1.4 * BASE;     // ≈ 8.96
const gridH    = 1.4 * HMAX;     // ≈ 7.28
const ox = -gridW/2, oy = -0.7;
for(let i = 0; i <= Math.round(gridW/cellSize); i++){
  const x = ox + i * cellSize;
  gridGroup.add(makeLine(
    [new THREE.Vector3(x, oy, -0.01), new THREE.Vector3(x, oy + gridH, -0.01)],
    0x26263d, 0.55
  ));
}
for(let j = 0; j <= Math.round(gridH/cellSize); j++){
  const y = oy + j * cellSize;
  gridGroup.add(makeLine(
    [new THREE.Vector3(ox, y, -0.01), new THREE.Vector3(ox + gridW, y, -0.01)],
    0x26263d, 0.55
  ));
}
scene.add(gridGroup);

// Bodenlinie etwas prominenter
scene.add(makeLine(
  [new THREE.Vector3(-gridW/2, 0, 0), new THREE.Vector3(gridW/2, 0, 0)],
  0x777799, 0.7
));

// ============== "GHOST" DREIECK (immer sichtbar) ==============
const ghostGroup = new THREE.Group();
const triShape = new THREE.Shape();
triShape.moveTo(V_LEFT.x,  V_LEFT.y);
triShape.lineTo(V_RIGHT.x, V_RIGHT.y);
triShape.lineTo(V_APEX.x,  V_APEX.y);
triShape.closePath();
const triGeo  = new THREE.ShapeGeometry(triShape);
const triMesh = new THREE.Mesh(triGeo, makeMat(0x333355, 0.08));
triMesh.position.z = -0.005;
ghostGroup.add(triMesh);
[[V_LEFT,V_RIGHT],[V_LEFT,V_APEX],[V_RIGHT,V_APEX]].forEach(([a,b]) => {
  ghostGroup.add(makeLine([a,b], 0x555575, 0.35));
});
scene.add(ghostGroup);

// ============== KAPITEL 1: Vorderseite + Maße ==============
const ch1 = new THREE.Group();
scene.add(ch1);

[[V_LEFT,V_RIGHT],[V_LEFT,V_APEX],[V_RIGHT,V_APEX]].forEach(([a,b]) => {
  ch1.add(makeLine([a,b], 0x58c4dd, 1));
});
ch1.add(makeDot(V_LEFT));
ch1.add(makeDot(V_RIGHT));
ch1.add(makeDot(V_APEX));

// Bodenmaß "16 m" (gelb)
const baseY = -0.55;
ch1.add(makeLine([new THREE.Vector3(V_LEFT.x,  baseY, 0), new THREE.Vector3(V_RIGHT.x, baseY, 0)], 0xf0c674, 1));
ch1.add(makeLine([new THREE.Vector3(V_LEFT.x,  baseY-0.1, 0), new THREE.Vector3(V_LEFT.x,  baseY+0.1, 0)], 0xf0c674, 1));
ch1.add(makeLine([new THREE.Vector3(V_RIGHT.x, baseY-0.1, 0), new THREE.Vector3(V_RIGHT.x, baseY+0.1, 0)], 0xf0c674, 1));
const lblBase = makeLabel('16 m', '#f0c674', 50);
lblBase.position.set(0, baseY - 0.4, 0);
ch1.add(lblBase);

// Höhenmaß "13 m" (gelb) links
const hX = V_LEFT.x - 0.7;
ch1.add(makeLine([new THREE.Vector3(hX, 0, 0), new THREE.Vector3(hX, HMAX, 0)], 0xf0c674, 1));
ch1.add(makeLine([new THREE.Vector3(hX-0.1, 0,    0), new THREE.Vector3(hX+0.1, 0,    0)], 0xf0c674, 1));
ch1.add(makeLine([new THREE.Vector3(hX-0.1, HMAX, 0), new THREE.Vector3(hX+0.1, HMAX, 0)], 0xf0c674, 1));
ch1.add(makeLine([new THREE.Vector3(hX, HMAX, 0), V_APEX], 0xf0c674, 0.4));
const lblHeight = makeLabel('13 m', '#f0c674', 50);
lblHeight.position.set(hX - 0.55, HMAX/2, 0);
ch1.add(lblHeight);

setGroupOpacity(ch1, 0);

// ============== KAPITEL 2: Lineare Funktion (Querschnitte + Funktion) ==============
const ch2 = new THREE.Group();
scene.add(ch2);

function tentWidthAt(yScaled){
  return BASE * (1 - yScaled / HMAX);
}

// Vier Beispiel-Querschnitte (grün)
[1.0, 2.1, 3.2, 4.3].forEach(y => {
  const w = tentWidthAt(y);
  ch2.add(makeLine(
    [new THREE.Vector3(-w/2, y, 0.001), new THREE.Vector3(w/2, y, 0.001)],
    0x83c167, 0.55
  ));
  // kleine Endpunkte
  ch2.add(makeDot(new THREE.Vector3(-w/2, y, 0.001), 0x83c167, 0.05));
  ch2.add(makeDot(new THREE.Vector3( w/2, y, 0.001), 0x83c167, 0.05));
});

// Funktions-Label oben rechts
const lblFunc = makeLabel('b(z) = -16/13 z + 16', '#83c167', 48);
lblFunc.position.set(2.3, HMAX + 0.55, 0);
ch2.add(lblFunc);

// kleines z-Pfeil-Hinweis
ch2.add(makeLine(
  [new THREE.Vector3(BASE/2 + 0.15, 0.2, 0), new THREE.Vector3(BASE/2 + 0.15, HMAX - 0.2, 0)],
  0x83c167, 0.7
));
const lblZ = makeLabel('z', '#83c167', 44);
lblZ.position.set(BASE/2 + 0.5, HMAX/2, 0);
ch2.add(lblZ);

setGroupOpacity(ch2, 0);

// ============== KAPITEL 3: Höhe z = 9 markieren ==============
const ch3 = new THREE.Group();
scene.add(ch3);

// Horizontale Linie auf z=9 quer durch die Szene
const z9LineL = -gridW/2 + 0.4;
const z9LineR =  gridW/2 - 0.4;
ch3.add(makeLine(
  [new THREE.Vector3(z9LineL, Z9, 0.002), new THREE.Vector3(z9LineR, Z9, 0.002)],
  0x83c167, 0.85
));
// Höhen-Label
const lblZ9 = makeLabel('z = 9 m', '#83c167', 46);
lblZ9.position.set(z9LineR - 0.85, Z9 + 0.38, 0);
ch3.add(lblZ9);

// Schnittpunkte mit den Zeltkanten
ch3.add(makeDot(new THREE.Vector3(-W9/2, Z9, 0.003), 0x83c167, 0.075));
ch3.add(makeDot(new THREE.Vector3( W9/2, Z9, 0.003), 0x83c167, 0.075));

// Vertikale Hilfslinie z=0 → z=9 als kleine "9 m"-Bezugshöhe
const hX2 = V_RIGHT.x + 0.55;
ch3.add(makeLine([new THREE.Vector3(hX2, 0,  0), new THREE.Vector3(hX2, Z9, 0)], 0x83c167, 0.55));
ch3.add(makeLine([new THREE.Vector3(hX2-0.1, 0,  0), new THREE.Vector3(hX2+0.1, 0,  0)], 0x83c167, 0.7));
ch3.add(makeLine([new THREE.Vector3(hX2-0.1, Z9, 0), new THREE.Vector3(hX2+0.1, Z9, 0)], 0x83c167, 0.7));

setGroupOpacity(ch3, 0);

// ============== KAPITEL 3 (Berechnung): verfügbare Breite 4,92 m ==============
const ch4 = new THREE.Group();
scene.add(ch4);

// Dicker gelber Balken zwischen den Schnittpunkten (= verfügbare Breite)
const widthBar = new THREE.Mesh(
  new THREE.PlaneGeometry(W9, 0.10),
  makeMat(0xf0c674, 0.95)
);
widthBar.position.set(0, Z9, 0.004);
ch4.add(widthBar);
// Endkappen
ch4.add(makeLine([new THREE.Vector3(-W9/2, Z9-0.18, 0.004), new THREE.Vector3(-W9/2, Z9+0.18, 0.004)], 0xf0c674, 1));
ch4.add(makeLine([new THREE.Vector3( W9/2, Z9-0.18, 0.004), new THREE.Vector3( W9/2, Z9+0.18, 0.004)], 0xf0c674, 1));

// Beschriftung
const lblWidth = makeLabel('b(9) ≈ 4,92 m', '#f0c674', 50);
lblWidth.position.set(0, Z9 + 0.55, 0);
ch4.add(lblWidth);

setGroupOpacity(ch4, 0);

// ============== KAPITEL 4: Bildschirm aufhängen ==============
const ch5 = new THREE.Group();
scene.add(ch5);

// Bildschirm: Oberkante auf z=9, Breite 5 m, kleine sichtbare Höhe nach unten
const screenH = 1.0;
const screenMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(SCREEN, screenH),
  makeMat(0xfc6255, 0.42)
);
screenMesh.position.set(0, Z9 - screenH/2, 0.006);
ch5.add(screenMesh);
// Bildschirm-Kanten
const sL = -SCREEN/2, sR = SCREEN/2, sT = Z9, sB = Z9 - screenH;
[
  [new THREE.Vector3(sL, sT, 0.007), new THREE.Vector3(sR, sT, 0.007)], // Oberkante
  [new THREE.Vector3(sL, sB, 0.007), new THREE.Vector3(sR, sB, 0.007)], // Unterkante
  [new THREE.Vector3(sL, sT, 0.007), new THREE.Vector3(sL, sB, 0.007)], // links
  [new THREE.Vector3(sR, sT, 0.007), new THREE.Vector3(sR, sB, 0.007)]  // rechts
].forEach(([a,b]) => ch5.add(makeLine([a,b], 0xfc6255, 1)));

// Bildschirm-Beschriftung
const lblScreen = makeLabel('Bildschirm: 5 m breit', '#fc6255', 44);
lblScreen.position.set(0, sB - 0.45, 0);
ch5.add(lblScreen);

setGroupOpacity(ch5, 0);

// ============== KAPITEL 5: Fazit ==============
const ch6 = new THREE.Group();
scene.add(ch6);

const lblFinal = makeLabel('4,92 < 5  →  passt nicht', '#fc6255', 54);
lblFinal.position.set(0, HMAX + 0.95, 0);
ch6.add(lblFinal);

setGroupOpacity(ch6, 0);

// ============== KAPITEL-DEFINITIONEN ==============
const chapters = [
  {
    t: 5.0,
    label: 'Kapitel 1 von 5',
    title: 'Die <span class="c-cyan">Vorderseite</span> des Festivalzelts',
    desc: 'Wir schauen uns die dreieckige Front an: <span class="c-yellow">16 m</span> breit am Boden, <span class="c-yellow">13 m</span> hoch in der Spitze. Damit wird die Aufgabe zu einem 2D-Problem.',
    enter: () => fadeIn(ch1)
  },
  {
    t: 7.0,
    label: 'Kapitel 2 von 5',
    title: 'Die Breite hängt <span class="c-teal">linear</span> von der Höhe ab',
    desc: 'Bei <span class="c-teal">z = 0</span> ist das Zelt <span class="c-yellow">16 m</span> breit, in der Spitze (z = 13) ist die Breite 0. Daraus folgt die lineare Funktion <span class="c-teal formula">b(z) = -16/13 · z + 16</span>.',
    enter: () => fadeIn(ch2)
  },
  {
    t: 6.5,
    label: 'Kapitel 3 von 5',
    title: 'Auf <span class="c-green">z = 9 m</span> einsetzen',
    desc: 'Wir setzen <span class="c-green">z = 9</span> in die Funktion ein: <span class="formula">b(9) = -144/13 + 208/13 = 64/13</span>, also rund <span class="c-yellow">4,92 m</span> verfügbare Breite.',
    enter: () => { fadeOut(ch2); fadeIn(ch3); fadeIn(ch4); }
  },
  {
    t: 5.5,
    label: 'Kapitel 4 von 5',
    title: 'Den <span class="c-red">Bildschirm</span> aufhängen',
    desc: 'Der LED-Bildschirm ist <span class="c-red">5 m</span> breit. Wir hängen ihn waagerecht mit Oberkante auf <span class="c-green">9 m</span> ein – er ragt links und rechts knapp über die Zeltkanten hinaus.',
    enter: () => fadeIn(ch5)
  },
  {
    t: 6.0,
    label: 'Kapitel 5 von 5',
    title: '<span class="c-red">Der Platz reicht nicht aus</span>',
    desc: 'Vergleich: <span class="formula"><span class="c-yellow">4,92 m</span> &lt; <span class="c-red">5 m</span></span>. Auf 9 m Höhe ist das Zelt nur 4,92 m breit – der 5 m breite Bildschirm passt also nicht hinein.',
    enter: () => fadeIn(ch6)
  }
];

let totalDur = 0;
chapters.forEach(c => { c.start = totalDur; totalDur += c.t; });

// ============== ANIMATION CONTROL ==============
const fadeAnims = new Map();

function fadeIn(group, duration){
  duration = duration || 0.7;
  fadeAnims.set(group, {start: performance.now()/1000, from: getOpacityFactor(group), to: 1, duration});
}
function fadeOut(group, duration){
  duration = duration || 0.5;
  fadeAnims.set(group, {start: performance.now()/1000, from: getOpacityFactor(group), to: 0, duration});
}
function getOpacityFactor(group){
  let f = 0;
  group.traverse(o => {
    if(o.material){
      const m = Array.isArray(o.material) ? o.material[0] : o.material;
      if(m && m.userData && m.userData.maxOp){
        f = Math.max(f, m.opacity / m.userData.maxOp);
      }
    }
  });
  return f;
}
function snapShow(group){ setGroupOpacity(group, 1); }
function snapHide(group){ setGroupOpacity(group, 0); }

const chapterGroups = [ch1, ch2, ch3, ch4, ch5, ch6];

function setEndState(i){
  chapterGroups.forEach(g => snapHide(g));
  fadeAnims.clear();
  if(i < 0) return;
  const showAfter = [
    [ch1],                          // nach Kap. 1
    [ch1, ch2],                     // nach Kap. 2
    [ch1, ch3, ch4],                // nach Kap. 3 (ch2 ausgeblendet)
    [ch1, ch3, ch4, ch5],           // nach Kap. 4
    [ch1, ch3, ch4, ch5, ch6]       // nach Kap. 5
  ];
  showAfter[i].forEach(g => snapShow(g));
}

// ============== STATE ==============
let currentChapter = 0;
let chapterStartTime = 0;
let isPaused = false;
let pauseOffset = 0;
let postEndTimer = 0;
let lastTickTime = performance.now()/1000;

const infoLabel = document.getElementById('info-label');
const infoTitle = document.getElementById('info-title');
const infoDesc  = document.getElementById('info-desc');

function updateInfoPanel(){
  const ch = chapters[currentChapter];
  infoLabel.textContent = ch.label;
  infoTitle.innerHTML  = ch.title;
  infoDesc.innerHTML   = ch.desc;
}
function enterChapter(i){
  currentChapter = i;
  chapterStartTime = performance.now()/1000;
  postEndTimer = 0;
  updateInfoPanel();
  if(chapters[i].enter) chapters[i].enter();
}
function seekTo(i){
  if(i < 0) i = 0;
  if(i >= chapters.length) i = chapters.length - 1;
  setEndState(i - 1);
  enterChapter(i);
  isPaused = false;
  document.getElementById('btn-pause').textContent = '⏸ Pause';
}
function restart(){
  setEndState(-1);
  enterChapter(0);
  isPaused = false;
  document.getElementById('btn-pause').textContent = '⏸ Pause';
}

// ============== TIMELINE ==============
const timeline = document.getElementById('timeline');
chapters.forEach((ch, i) => {
  const seg = document.createElement('div');
  seg.className = 'segment';
  seg.style.flex = ch.t;

  const fill = document.createElement('div'); fill.className = 'fill';
  seg.appendChild(fill);

  const num = document.createElement('div'); num.className = 'num';
  num.textContent = (i+1);
  seg.appendChild(num);

  const ts = document.createElement('div'); ts.className = 'ts';
  const m = Math.floor(ch.start / 60);
  const s = Math.floor(ch.start % 60).toString().padStart(2,'0');
  ts.textContent = `${m}:${s}`;
  seg.appendChild(ts);

  const tt = document.createElement('div'); tt.className = 'tooltip';
  const tmp = document.createElement('div'); tmp.innerHTML = ch.title;
  tt.textContent = `${tmp.textContent} · ${ch.t}s`;
  seg.appendChild(tt);

  seg.addEventListener('click', () => seekTo(i));
  timeline.appendChild(seg);
});
const segmentEls = Array.from(timeline.children);

function updateTimeline(){
  const chElapsed = isPaused ? pauseOffset : (performance.now()/1000 - chapterStartTime);
  segmentEls.forEach((seg, i) => {
    const fill = seg.querySelector('.fill');
    if(i < currentChapter){
      fill.style.width = '100%';
    } else if(i > currentChapter){
      fill.style.width = '0%';
    } else {
      const t = Math.min(1, chElapsed / chapters[i].t);
      fill.style.width = (t * 100) + '%';
    }
  });
}

// ============== BUTTONS ==============
document.getElementById('btn-restart').addEventListener('click', restart);
document.getElementById('btn-pause').addEventListener('click', () => {
  if(!isPaused){
    pauseOffset = performance.now()/1000 - chapterStartTime;
    isPaused = true;
    document.getElementById('btn-pause').textContent = '▶ Play';
  } else {
    chapterStartTime = performance.now()/1000 - pauseOffset;
    isPaused = false;
    document.getElementById('btn-pause').textContent = '⏸ Pause';
  }
});

// ============== ANIMATION LOOP ==============
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now()/1000;
  const dt  = now - lastTickTime;
  lastTickTime = now;

  // Fades aktualisieren
  fadeAnims.forEach((data, group) => {
    const t = (now - data.start) / data.duration;
    if(t >= 1){
      setGroupOpacity(group, data.to);
      fadeAnims.delete(group);
    } else {
      const e = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
      const v = data.from + (data.to - data.from) * e;
      setGroupOpacity(group, v);
    }
  });

  if(!isPaused){
    const chElapsed = now - chapterStartTime;
    if(chElapsed >= chapters[currentChapter].t){
      if(currentChapter < chapters.length - 1){
        enterChapter(currentChapter + 1);
      } else {
        postEndTimer += dt;
        if(postEndTimer > 2.5){
          postEndTimer = 0;
          restart();
        }
      }
    }
    updateTimeline();
  }

  renderer.render(scene, camera);
}

// ============== RESIZE ==============
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, true);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

// ============== INIT ==============
setEndState(-1);
enterChapter(0);
animate();
</script>
